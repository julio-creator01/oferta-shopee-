<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta Especial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #fff3e8, #ffe0cc);
      color: #222;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,.12);
    }
    .icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #ff6b00;
      font-size: 38px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }
    p {
      color: #666;
      line-height: 1.5;
      font-size: 16px;
      margin-bottom: 28px;
    }
    .button {
      display: block;
      width: 100%;
      padding: 17px 20px;
      border-radius: 14px;
      background: #ff5a00;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 8px 20px rgba(255,90,0,.25);
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 25px rgba(255,90,0,.32);
    }
    .small {
      margin-top: 18px;
      margin-bottom: 0;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🛍️</div>
    <h1>Oferta especial</h1>
    <p>Confira o produto e aproveite a oferta diretamente na Shopee.</p>

    <a
      class="button"
      href="https://s.shopee.com.br/9AOLVJf9tb"
      target="_blank"
      rel="noopener noreferrer"
    >
      🛒 Ver produto na Shopee
    </a>

    <p class="small">Você será direcionado para a Shopee.</p>
  </main>
</body>
</html>
